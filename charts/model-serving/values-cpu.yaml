# CPU overlay — uses real, published images
model:
  name: "local-llm"
  huggingfaceId: "Qwen/Qwen2.5-0.5B-Instruct"

runtime:
  type: "custom-vllm"
  customVllm:
    # Official vLLM CPU image (x86_64). Ton laptop étant x86_64, on prend ce tag.
    image: "vllm/vllm-openai-cpu:latest-x86_64"
    args:
      - "--max-model-len=1024"
      - "--dtype=float32"
      - "--enforce-eager"
      - "--device=cpu"

resources:
  requests:
    cpu: "1"
    memory: "3Gi"
  limits:
    cpu: "3"
    memory: "5Gi"

gpu:
  enabled: false

autoscaling:
  minReplicas: 1
  maxReplicas: 1

# Guardrails désactivé pour le moment.
# Pour le réactiver il faudra builder une image custom depuis
# https://github.com/guardrails-ai/guardrails-lite-server (Dockerfile fourni)
guardrails:
  enabled: false
