apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .Values.model.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "model-serving.labels" . | nindent 4 }}
  annotations:
    autoscaling.knative.dev/min-scale: "{{ .Values.autoscaling.minReplicas }}"
    autoscaling.knative.dev/max-scale: "{{ .Values.autoscaling.maxReplicas }}"
    autoscaling.knative.dev/metric: "{{ .Values.autoscaling.metric }}"
    autoscaling.knative.dev/target: "{{ .Values.autoscaling.target }}"
spec:
  predictor:
    model:
      modelFormat:
        name: huggingface
      {{- if eq .Values.runtime.type "kserve-huggingface" }}
      runtime: kserve-huggingfaceserver
      storageUri: "hf://{{ .Values.model.huggingfaceId }}"
      {{- else }}
      runtime: {{ include "model-serving.fullname" . }}-vllm
      # No storageUri — vLLM downloads directly from HF Hub via MODEL_ID env var
      # (cached in /tmp/hf-cache). This avoids the /mnt/models collision between
      # KServe's storage-initializer and our own hf-cache volume.
      {{- end }}

      {{- if .Values.model.task }}
      args:
        - "--task={{ .Values.model.task }}"
      {{- end }}

      resources:
        requests:
          {{- toYaml .Values.resources.requests | nindent 10 }}
          {{- include "model-serving.gpuLimits" . | nindent 10 }}
        limits:
          {{- toYaml .Values.resources.limits | nindent 10 }}
          {{- include "model-serving.gpuLimits" . | nindent 10 }}

    {{- with .Values.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.affinity }}
    affinity:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
