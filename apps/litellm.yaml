apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: ghcr.io/berriai
    chart: litellm-helm
    targetRevision: "0.1.800"
    helm:
      releaseName: litellm
      values: |
        # ---- LiteLLM proxy config ----
        proxy_config:
          model_list:
            # ---- In-cluster model via KServe ----
            - model_name: local-llm
              litellm_params:
                model: hosted_vllm/local-llm
                api_base: http://local-llm-predictor.model-serving.svc.cluster.local/v1
                api_key: "dummy-key"

            # ---- External fallback (Anthropic) ----
            - model_name: claude-sonnet
              litellm_params:
                model: anthropic/claude-sonnet-4-5-20250929
                api_key: os.environ/ANTHROPIC_API_KEY

          # ---- Guardrails: top-level block, NOT inside litellm_settings ----
          # No "callbacks: [guardrails_ai]" — that was wrong and tried to import
          # /etc/litellm/.py as a Python module.
          guardrails:
            - guardrail_name: "input-guard"
              litellm_params:
                guardrail: "guardrails_ai"
                mode: "pre_call"
                guard_name: "input-guard"
                api_base: "http://guardrails.model-serving.svc.cluster.local:8000"
            - guardrail_name: "output-guard"
              litellm_params:
                guardrail: "guardrails_ai"
                mode: "post_call"
                guard_name: "output-guard"
                api_base: "http://guardrails.model-serving.svc.cluster.local:8000"

          general_settings:
            master_key: os.environ/PROXY_MASTER_KEY

        masterkey: "sk-litellm-local-dev-key"

        service:
          type: NodePort
          port: 4000

        envFromSecrets:
          - name: litellm-external-keys
            optional: true

        db:
          deployStandalone: true
          useExisting: false

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi

        envVars:
          UI_USERNAME: admin
          UI_PASSWORD: admin
  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
